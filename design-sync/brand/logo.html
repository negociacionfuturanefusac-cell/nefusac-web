<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logo NEFUSAC</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
  :root{--brand:#80bc00;--brand-dark:#669600;--brand-light:#eef7d8;--navy:#061325;--navy-soft:#0d2036;--ink:#101828;--steel:#475467;--mist:#f4f6f0;--line:#e5e8e0;--wsp:#25d366}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#fff;padding:24px}
  .display{font-family:'Barlow',system-ui,sans-serif}
  h1,h2,h3{font-family:'Barlow',system-ui,sans-serif}
.row{display:flex;gap:16px;flex-wrap:wrap}
   .tile{border-radius:14px;padding:28px 38px;display:flex;align-items:center;border:1px solid var(--line)}
   img{height:44px;width:auto}</style></head><body><div class="row">
    <div class="tile" style="background:#fff"><img src="../assets/logo-negro.png" alt="NEFUSAC"></div>
    <div class="tile" style="background:var(--navy)"><img src="../assets/logo-blanco.png" alt="NEFUSAC"></div>
    <div class="tile" style="background:var(--brand)"><img src="../assets/logo-negro.png" alt="NEFUSAC"></div>
  </div></body></html>
