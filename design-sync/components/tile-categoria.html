<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjeta-menú de categoría</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
  :root{--brand:#80bc00;--brand-dark:#669600;--brand-light:#eef7d8;--navy:#061325;--navy-soft:#0d2036;--ink:#101828;--steel:#475467;--mist:#f4f6f0;--line:#e5e8e0;--wsp:#25d366}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#fff;padding:24px}
  .display{font-family:'Barlow',system-ui,sans-serif}
  h1,h2,h3{font-family:'Barlow',system-ui,sans-serif}
.tile{position:relative;display:block;width:380px;aspect-ratio:4/3;overflow:hidden;text-decoration:none;background:var(--navy)}
   .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.5s}
   .tile:hover img{transform:scale(1.05)}
   .grad{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(to top,#000000d9,#00000066 55%,transparent)}
   .txt{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
   .chip{background:var(--brand-dark);color:#fff;font-family:'Barlow';font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;line-height:1;padding:5px 8px;border-radius:3px}
   .txt h3{margin-top:6px;font-size:17px;font-weight:800;color:#fff;line-height:1.2}
   .txt p{margin-top:4px;color:#ffffffd9;font-size:12px;line-height:1.4;max-width:38ch}
   .txt span{margin-top:6px;color:#fffffff2;font-weight:700;font-size:12px;text-decoration:underline;text-underline-offset:4px}
   .tile:hover .txt span{color:var(--brand)}</style></head><body><a class="tile" href="#"><img src="../assets/cat-antideslizantes.webp" alt=""><div class="grad"></div><div class="txt"><span class="chip">Antideslizantes</span><h3 class="display">Cada paso, seguro</h3><p>Evitan resbalones en escaleras y rampas: adhesivo, cinta, base + tapa o paso completo.</p><span>Explora →</span></div></a></body></html>
